<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Check Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    h2 {
      color: #1a3c6e;
      font-size: 22px;
      margin-bottom: 6px;
    }

    p.sub {
      color: #777;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #dde3f0;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: border 0.2s;
    }

    input:focus { border-color: #1a3c6e; }

    button {
      padding: 12px 20px;
      background: #1a3c6e;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #14305a; }

    #status {
      font-size: 13px;
      margin-bottom: 16px;
      color: #e74c3c;
      min-height: 18px;
    }

    .result-box { display: none; }

    .student-name {
      font-size: 18px;
      font-weight: 700;
      color: #1a3c6e;
      margin-bottom: 4px;
    }

    .student-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: #1a3c6e;
      color: white;
    }

    th, td {
      padding: 10px 14px;
      text-align: left;
      font-size: 13px;
    }

    tbody tr:nth-child(even) { background: #f7f9ff; }
    tbody tr:hover { background: #eef1fb; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .pass { background: #d4edda; color: #1e7e34; }
    .fail { background: #f8d7da; color: #c0392b; }
  </style>
</head>
<body>

<div class="card">
  <h2>📋 Check Your Results</h2>
  <p class="sub">Enter your Index Number or NIC to view your semester results.</p>

  <div class="input-row">
    <input type="text" id="queryInput" placeholder="e.g. 2024/CS/001 or 200012345678" />
    <button onclick="fetchResult()">Search</button>
  </div>

  <div id="status"></div>

  <div class="result-box" id="resultBox">
    <div class="student-name" id="studentName"></div>
    <div class="student-meta" id="studentMeta"></div>
    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Marks</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="subjectRows"></tbody>
    </table>
  </div>
</div>

<script>
  const SHEET_ID = "https://docs.google.com/spreadsheets/d/1nhYBtaXvm7tm7kb9EXOdX1AGu6BhiLzaysZjUEgFCKg/edit?usp=sharing";
  const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  async function fetchResult() {
    const query = document.getElementById("queryInput").value.trim().toLowerCase();
    const status = document.getElementById("status");
    const resultBox = document.getElementById("resultBox");

    status.textContent = "";
    resultBox.style.display = "none";

    if (!query) {
      status.textContent = "⚠️ Please enter your Index Number or NIC.";
      return;
    }

    status.textContent = "Searching...";
    status.style.color = "#1a3c6e";

    try {
      const res = await fetch(URL);
      const text = await res.text();

      // Google wraps JSON in /*O_o*/ google.visualization.Query.setResponse(...)
      const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);/)[1]);
      const rows = json.table.rows;
      const cols = json.table.cols;

      let found = null;
      for (const row of rows) {
        const indexNo = String(row.c[0]?.v || "").trim().toLowerCase();
        const nic     = String(row.c[1]?.v || "").trim().toLowerCase();
        if (indexNo === query || nic === query) {
          found = row;
          break;
        }
      }

      if (!found) {
        status.textContent = "❌ No results found. Please check your Index Number or NIC.";
        status.style.color = "#e74c3c";
        return;
      }

      status.textContent = "";

      const name      = found.c[2]?.v || "N/A";
      const subject1  = found.c[3]?.v ?? "N/A";
      const subject2  = found.c[4]?.v ?? "N/A";
      const subject3  = found.c[5]?.v ?? "N/A";
      const semester  = found.c[6]?.v || "N/A";
      const indexDisp = found.c[0]?.v || "N/A";

      document.getElementById("studentName").textContent = "🎓 " + name;
      document.getElementById("studentMeta").textContent =
        `Index: ${indexDisp}  |  Semester: ${semester}`;

      const subjects = [
        { name: cols[3]?.label || "Subject 1", marks: subject1 },
        { name: cols[4]?.label || "Subject 2", marks: subject2 },
        { name: cols[5]?.label || "Subject 3", marks: subject3 },
      ];

      const tbody = document.getElementById("subjectRows");
      tbody.innerHTML = "";
      for (const s of subjects) {
        const pass = Number(s.marks) >= 50;
        const badge = `<span class="badge ${pass ? 'pass' : 'fail'}">${pass ? 'Pass' : 'Fail'}</span>`;
        tbody.innerHTML += `
          <tr>
            <td>${s.name}</td>
            <td>${s.marks}</td>
            <td>${badge}</td>
          </tr>`;
      }

      resultBox.style.display = "block";

    } catch (err) {
      status.textContent = "⚠️ Could not load data. Please try again later.";
      status.style.color = "#e74c3c";
    }
  }

  document.getElementById("queryInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") fetchResult();
  });
</script>

</body>
</html>
